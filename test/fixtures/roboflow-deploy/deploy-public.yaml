name: Deploy Public
run-name: ${{ inputs.environment == 'prod' && (inputs.skip_eu && '[Prod — EU SKIPPED]' || '[Prod + EU Prod]') || inputs.environment == 'staging' && (inputs.skip_eu && '[Staging — EU SKIPPED]' || '[Staging + EU Staging]') || inputs.environment == 'eu-prod' && '[EU Prod]' || inputs.environment == 'eu-staging' && '[EU Staging]' || '[Staging]' }} Deploy Public
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Environment (prod and staging each deploy US + EU in parallel)
        options:
          - staging
          - prod
          - eu-staging
          - eu-prod
        default: staging
      skip_eu:
        type: boolean
        description: 'BREAK-GLASS: skip the EU leg of a prod OR staging deploy (US-only). Requires skip_eu_reason; loudly posted to Slack.'
        default: false
      skip_eu_reason:
        description: 'Required when skip_eu is true: why is EU being skipped? (audited)'
        required: false
        default: ''
